name: Publicar asignacion nominal
on:
  push:
    paths:
      - publicar_estudiantes.py
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar fichas y carpetas verificadas
        run: python publicar_estudiantes.py
      - name: Comprobar indice y sintaxis
        run: |
          python -m compileall -q src pruebas ejecutar_caso.py
          python ejecutar_caso.py --listar
      - name: Guardar asignacion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Asignar actividades a ocho estudiantes y ampliar guia VS Code Copilot"
          git push origin HEAD:main
